    </pnx-nomenclature>

    <pnx-map 
      height="500px" 
      class="map-card" 
      [geolocation]="true">

      <pnx-leaflet-draw
        [zoomLevel]="1"
        [options]="leafletDrawOptions"
        [geojson]="form.get('geom_local')?.value"
        (layerDrawed)="onGeometryDrawn($event)"
        (layerDeleted)="clearGeometry()"
      ></pnx-leaflet-draw>

    </pnx-map>
